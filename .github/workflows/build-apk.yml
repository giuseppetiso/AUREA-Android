name: Applica hotfix e pubblica AUREA 0.2.10

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Applica la correzione del bip microfono
        run: |
          python3 -c "import base64,gzip;exec(gzip.decompress(base64.b64decode('')))"

      - name: Registra la versione 0.2.10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/it/creativemaker3d/aurea/MainActivity.java app/src/main/AndroidManifest.xml app/build.gradle version.json
          git diff --cached --check
          git commit -m "AUREA 0.2.10: elimina bip continuo del microfono"
          git push

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ricrea la chiave di firma AUREA
        env:
          AUREA_KEYSTORE_BASE64: ${{ secrets.AUREA_KEYSTORE_BASE64 }}
        run: |
          echo "$AUREA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/AUREA-release.jks"
          test -s "$RUNNER_TEMP/AUREA-release.jks"

      - name: Compila APK release firmato
        env:
          AUREA_KEYSTORE_PATH: ${{ runner.temp }}/AUREA-release.jks
          AUREA_KEYSTORE_PASSWORD: ${{ secrets.AUREA_KEYSTORE_PASSWORD }}
          AUREA_KEY_ALIAS: ${{ secrets.AUREA_KEY_ALIAS }}
          AUREA_KEY_PASSWORD: ${{ secrets.AUREA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verifica e prepara APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk AUREA.apk

      - name: Conserva APK
        uses: actions/upload-artifact@v4
        with:
          name: AUREA-Android-release-signed
          path: AUREA.apk

      - name: Pubblica APK per aggiornamento diretto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aurea-latest --cleanup-tag -y || true
          gh release create aurea-latest AUREA.apk --title "AUREA aggiornamento corrente" --notes "AUREA 0.2.10: parola chiave attiva senza bip continuo del microfono."
