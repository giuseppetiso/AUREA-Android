plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("AUREA_KEYSTORE_PATH")
def cameraxVersion = "1.5.3"

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    implementation "com.google.mlkit:face-detection:16.1.7"
    implementation "org.opencv:opencv:4.14.0"
    implementation "net.java.dev.jna:jna:5.18.1@aar"
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

def aureaFaceModel = file("src/main/assets/face_recognition_sface_2021dec_int8.onnx")
def aureaFaceLicense = file("src/main/assets/licenses/SFACE_LICENSE.txt")
def aureaFaceModelUrl =
    "https://github.com/opencv/opencv_zoo/raw/" +
    "47534e27c9851bb1128ccc0102f1145e27f23f98/models/" +
    "face_recognition_sface/face_recognition_sface_2021dec_int8.onnx"
def aureaFaceModelSha256 =
    "2b0e941e6f16cc048c20aee0c8e31f569118f65d702914540f7bfdc14048d78a"
def aureaFaceLicenseUrl =
    "https://raw.githubusercontent.com/opencv/opencv_zoo/" +
    "47534e27c9851bb1128ccc0102f1145e27f23f98/models/" +
    "face_recognition_sface/LICENSE"
def aureaFaceLicenseSha256 =
    "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

tasks.register("downloadAureaFaceModel") {
    outputs.file(aureaFaceModel)
    outputs.file(aureaFaceLicense)
    outputs.upToDateWhen { false }
    doLast {
        aureaFaceModel.parentFile.mkdirs()
        if (!aureaFaceModel.exists()) {
            new URL(aureaFaceModelUrl).withInputStream { input ->
                aureaFaceModel.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        aureaFaceModel.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) > 0) {
                digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != aureaFaceModelSha256) {
            aureaFaceModel.delete()
            throw new GradleException("Modello facciale AUREA non valido")
        }
        aureaFaceLicense.parentFile.mkdirs()
        if (!aureaFaceLicense.exists()) {
            new URL(aureaFaceLicenseUrl).withInputStream { input ->
                aureaFaceLicense.withOutputStream { output -> output << input }
            }
        }
        digest = java.security.MessageDigest.getInstance("SHA-256")
        aureaFaceLicense.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) > 0) {
                digest.update(buffer, 0, read)
            }
        }
        actual = digest.digest().encodeHex().toString()
        if (actual != aureaFaceLicenseSha256) {
            aureaFaceLicense.delete()
            throw new GradleException("Licenza modello facciale AUREA non valida")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("downloadAureaFaceModel")
}

android {
    namespace "it.creativemaker3d.aurea"
    compileSdk 35

    defaultConfig {
        applicationId "it.creativemaker3d.aurea"
        minSdk 26
        targetSdk 35
        versionCode 65
        versionName "0.15.1"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("AUREA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("AUREA_KEY_ALIAS")
                keyPassword System.getenv("AUREA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
