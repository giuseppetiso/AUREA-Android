plugins {
    id "com.android.application"
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}

android {
    namespace "it.creativemaker3d.aurea"
    compileSdk 35

    defaultConfig {
        applicationId "it.creativemaker3d.aurea"
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName "0.2.7"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("AUREA_KEYSTORE_PATH"))
            storePassword System.getenv("AUREA_KEYSTORE_PASSWORD")
            keyAlias System.getenv("AUREA_KEY_ALIAS")
            keyPassword System.getenv("AUREA_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
