name: Compila e pubblica AUREA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        run: gradle :app:assembleDebug

      - name: Prepara APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AUREA.apk

      - name: Conserva APK
        uses: actions/upload-artifact@v4
        with:
          name: AUREA-Android-debug
          path: AUREA.apk

      - name: Pubblica APK per aggiornamento diretto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aurea-latest --cleanup-tag -y || true
          gh release create aurea-latest AUREA.apk --title "AUREA aggiornamento corrente" --notes "APK corrente per aggiornamento diretto dal tablet."
