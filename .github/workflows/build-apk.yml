name: Compila e pubblica AUREA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila controllo pull request
        if: github.event_name == 'pull_request'
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Test riconoscimento prima della release
        if: github.event_name != 'pull_request'
        run: gradle :app:testDebugUnitTest

      - name: Ricrea la chiave di firma AUREA
        if: github.event_name != 'pull_request'
        env:
          AUREA_KEYSTORE_BASE64: ${{ secrets.AUREA_KEYSTORE_BASE64 }}
        run: |
          echo "$AUREA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/AUREA-release.jks"
          test -s "$RUNNER_TEMP/AUREA-release.jks"

      - name: Compila APK release firmato
        if: github.event_name != 'pull_request'
        env:
          AUREA_KEYSTORE_PATH: ${{ runner.temp }}/AUREA-release.jks
          AUREA_KEYSTORE_PASSWORD: ${{ secrets.AUREA_KEYSTORE_PASSWORD }}
          AUREA_KEY_ALIAS: ${{ secrets.AUREA_KEY_ALIAS }}
          AUREA_KEY_PASSWORD: ${{ secrets.AUREA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verifica e prepara APK
        if: github.event_name != 'pull_request'
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk AUREA.apk

      - name: Conserva APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AUREA-Android-release-signed
          path: AUREA.apk

      - name: Pubblica APK per aggiornamento diretto
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aurea-latest --cleanup-tag -y || true
          gh release create aurea-latest AUREA.apk --title "AUREA aggiornamento corrente" --notes "APK release firmato con la chiave permanente AUREA."
