plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("AUREA_KEYSTORE_PATH")
def cameraxVersion = "1.5.3"

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    implementation "com.google.mlkit:face-detection:16.1.7"
    implementation "net.java.dev.jna:jna:5.18.1@aar"
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
}

android {
    namespace "it.creativemaker3d.aurea"
    compileSdk 35

    defaultConfig {
        applicationId "it.creativemaker3d.aurea"
        minSdk 26
        targetSdk 35
        versionCode 57
        versionName "0.10.3"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("AUREA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("AUREA_KEY_ALIAS")
                keyPassword System.getenv("AUREA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
